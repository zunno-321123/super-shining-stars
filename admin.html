
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPER SHINING STARS - Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100d20;color:white;font-family:Arial,sans-serif;padding:20px}
.container{max-width:850px;margin:auto}
h1{color:#e8bd55;text-align:center}
h2{color:#e8bd55}
.card{background:#201a36;border:1px solid #51416e;border-radius:14px;padding:20px;margin:18px 0}
input,select,button{width:100%;padding:13px;margin:7px 0;border-radius:8px;border:1px solid #665681;font-size:15px}
input,select{background:#130f24;color:white}
button{background:#d9ad48;color:#171020;font-weight:bold;border:0;cursor:pointer}
button.danger{background:#a93645;color:white}
button.secondary{background:#51416e;color:white}
.hidden{display:none}
.message{padding:12px;border-radius:8px;margin:10px 0;background:#382c50;overflow-wrap:anywhere}
.player{background:#302747;padding:13px;border-radius:9px;margin:10px 0}
.player strong{color:#e8bd55}
.actions{display:flex;gap:8px}
.actions button{flex:1}
.small{color:#c5bbd5;font-size:13px}
</style>
</head>
<body>
<div class="container">
<h1>🌟 SUPER SHINING STARS</h1>
<p style="text-align:center">Official Admin Panel</p>

<div id="loginBox" class="card">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<div id="loginMessage" class="message hidden"></div>
</div>

<div id="dashboard" class="hidden">
<div class="card">
<h2>Admin Dashboard</h2>
<p id="welcome" class="small">Logged in</p>
<button id="logoutBtn" class="secondary">Logout</button>
</div>

<div class="card">
<h2>Players Management</h2>
<form id="playerForm">
<input id="playerName" placeholder="Player name" required>
<select id="playerRole" required>
<option value="">Select role</option>
<option>Batsman</option>
<option>Bowler</option>
<option>All-Rounder</option>
<option>Wicket Keeper</option>
<option>Fast Bowler</option>
</select>
<input id="jersey" type="number" placeholder="Jersey number (optional)">
<button id="saveBtn" type="submit">Add Player</button>
<button id="cancelEdit" type="button" class="secondary hidden">Cancel Edit</button>
</form>
<div id="playerMessage" class="message hidden"></div>
</div>

<div class="card">
<h2>Squad Players</h2>
<div id="playerList">Loading players...</div>
</div>
</div>
</div>

<script>
const SUPABASE_URL = "https://nvkqxeiicvwbuiogcbpj.supabase.co";
const SUPABASE_KEY = "sb_publishable_-C9Axiw3Y6JC2sbupeFVHQ_lSym4gKd";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let editingId = null;

function message(id, text) {
  $(id).textContent = text;
  $(id).classList.remove("hidden");
}

async function verifyAdmin() {
  const {data:{session}} = await db.auth.getSession();

  if (!session) {
    $("loginBox").classList.remove("hidden");
    $("dashboard").classList.add("hidden");
    return;
  }

  const {data, error} = await db.rpc("is_admin");

  if (error || data !== true) {
    await db.auth.signOut();
    $("loginBox").classList.remove("hidden");
    $("dashboard").classList.add("hidden");
    message("loginMessage", "This account is not authorized as an admin.");
    return;
  }

  $("loginBox").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  $("welcome").textContent = "Logged in: " + session.user.email;
  loadPlayers();
}

$("loginBtn").addEventListener("click", async () => {
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    message("loginMessage", "Please enter email and password.");
    return;
  }

  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "Logging in...";

  const {error} = await db.auth.signInWithPassword({email, password});

  $("loginBtn").disabled = false;
  $("loginBtn").textContent = "Login";

  if (error) {
    message("loginMessage", error.message);
    return;
  }

  await verifyAdmin();
});

$("logoutBtn").addEventListener("click", async () => {
  await db.auth.signOut();
  $("dashboard").classList.add("hidden");
  $("loginBox").classList.remove("hidden");
  $("password").value = "";
});

async function loadPlayers() {
  $("playerList").textContent = "Loading players...";

  const {data, error} = await db
    .from("players")
    .select("id,name,role,jersey_number,is_active")
    .order("name");

  if (error) {
    $("playerList").textContent = "Error: " + error.message;
    return;
  }

  $("playerList").replaceChildren();

  if (!data || data.length === 0) {
    $("playerList").textContent = "No players found.";
    return;
  }

  data.forEach(player => {
    const box = document.createElement("div");
    box.className = "player";

    const title = document.createElement("strong");
    title.textContent = player.name || "Unnamed player";

    const details = document.createElement("p");
    details.textContent =
      (player.role || "No role") +
      " | Jersey: " +
      (player.jersey_number ?? "Not set") +
      " | " +
      (player.is_active ? "Active" : "Inactive");

    const actions = document.createElement("div");
    actions.className = "actions";

    const edit = document.createElement("button");
    edit.textContent = "Edit";
    edit.addEventListener("click", () => editPlayer(player));

    const del = document.createElement("button");
    del.textContent = "Delete";
    del.className = "danger";
    del.addEventListener("click", () => deletePlayer(player.id));

    actions.append(edit, del);
    box.append(title, details, actions);
    $("playerList").append(box);
  });
}

$("playerForm").addEventListener("submit", async event => {
  event.preventDefault();

  const name = $("playerName").value.trim();
  const role = $("playerRole").value;
  const jerseyValue = $("jersey").value;

  if (!name || !role) {
    message("playerMessage", "Enter player name and role.");
    return;
  }

  const playerData = {
    name,
    role,
    jersey_number: jerseyValue === "" ? null : Number(jerseyValue),
    is_active: true
  };

  $("saveBtn").disabled = true;

  let result;

  if (editingId !== null) {
    result = await db.from("players").update(playerData).eq("id", editingId);
  } else {
    result = await db.from("players").insert(playerData);
  }

  $("saveBtn").disabled = false;

  if (result.error) {
    message("playerMessage", result.error.message);
    return;
  }

  message("playerMessage", editingId !== null ? "Player updated!" : "Player added!");
  resetForm();
  loadPlayers();
});

function editPlayer(player) {
  editingId = player.id;
  $("playerName").value = player.name || "";
  $("playerRole").value = player.role || "";
  $("jersey").value = player.jersey_number ?? "";
  $("saveBtn").textContent = "Update Player";
  $("cancelEdit").classList.remove("hidden");
  $("playerForm").scrollIntoView({behavior:"smooth"});
}

function resetForm() {
  editingId = null;
  $("playerForm").reset();
  $("saveBtn").textContent = "Add Player";
  $("cancelEdit").classList.add("hidden");
}

$("cancelEdit").addEventListener("click", resetForm);

async function deletePlayer(id) {
  if (!confirm("Are you sure you want to delete this player?")) return;

  const {error} = await db.from("players").delete().eq("id", id);

  if (error) {
    message("playerMessage", error.message);
    return;
  }

  message("playerMessage", "Player deleted.");
  loadPlayers();
}

verifyAdmin();
</script>
</body>
</html>
